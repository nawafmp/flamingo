<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Profit Calculator - Optimized Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f8fafc;
            --surface: #ffffff;
            --surface-border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: #f8fafc;
            
            --brand-primary: #4f46e5;
            --brand-success: #16a34a;
            --brand-warning: #ea580c;
            --brand-danger: #dc2626;
            
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-app);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px 12px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .phone-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        header {
            padding: 4px 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 1px;
        }

        .btn-clear {
            background: #fff;
            border: 1px solid var(--surface-border);
            color: var(--brand-danger);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        
        .btn-clear:active {
            transform: scale(0.97);
            background-color: #fff1f2;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.04);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-value {
            font-size: 0.68rem;
            font-weight: 700;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--brand-primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .input-prefix, .input-suffix {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            user-select: none;
        }
        .input-prefix { padding-left: 10px; }
        .input-suffix { padding-right: 10px; }

        input[type="number"] {
            width: 100%;
            height: 40px;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 0 8px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="number"]:focus {
            outline: none;
        }

        .results-panel-three {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .metric-tile {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .metric-label {
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-muted);
        }

        .metric-value {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chart-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .chart-bar-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chart-bar-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .chart-bar-bg {
            height: 6px;
            background: var(--input-bg);
            border-radius: 3px;
            overflow: hidden;
        }

        .chart-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px;
        }

        .chart-bar-fill.cost { background: var(--brand-warning); }
        .chart-bar-fill.rebate { background: var(--brand-danger); }
        .chart-bar-fill.profit { background: var(--brand-success); }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <header>
        <div>
            <h1>PROFIT ENGINE</h1>
            <p>B2B Revenue & Rebate Strategy</p>
        </div>
        <button class="btn-clear" onclick="resetCalculator()">✕ Reset</button>
    </header>

    <div class="card">
        <div class="grid-3">
            <div class="control-group">
                <label>Outer Size</label>
                <div class="input-wrapper">
                    <input type="number" id="outerSize" value="1" inputmode="numeric" pattern="[0-9]*" placeholder="1">
                </div>
            </div>
            <div class="control-group">
                <label>Outer Cost</label>
                <div class="input-wrapper">
                    <span class="input-prefix">AED</span>
                    <input type="number" id="outerCost" inputmode="decimal" placeholder="0.00">
                </div>
            </div>
            <div class="control-group">
                <label>Unit Cost</label>
                <div class="input-wrapper">
                    <span class="input-prefix">AED</span>
                    <input type="number" id="unitCost" inputmode="decimal" placeholder="0.00">
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="control-group">
                <div class="label-row">
                    <label>Supplier Discount</label>
                    <span class="badge-value" style="color:var(--brand-primary);" id="txtCostDiscount">0%</span>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="costDiscount" inputmode="decimal" min="0" max="100" step="0.1" placeholder="0.0">
                    <span class="input-suffix">%</span>
                </div>
            </div>

            <div class="control-group">
                <div class="label-row">
                    <label>Rebate</label>
                    <span class="badge-value" style="color:var(--brand-warning);" id="txtDeduction">0%</span>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="salesDeduction" value="18" inputmode="decimal" min="0" max="100" step="0.1" placeholder="0.0">
                    <span class="input-suffix">%</span>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="control-group">
                <div class="label-row">
                    <label>Margin</label>
                    <span class="badge-value" style="color:var(--brand-success);" id="txtMargin">0%</span>
                </div>
                <div class="input-wrapper">
                    <input type="number" id="targetMargin" inputmode="decimal" min="0" max="100" step="0.1" placeholder="0.0">
                    <span class="input-suffix">%</span>
                </div>
            </div>

            <div class="control-group">
                <label>Override Price</label>
                <div class="input-wrapper">
                    <span class="input-prefix">AED</span>
                    <input type="number" id="sellingPrice" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
                </div>
            </div>
        </div>
    </div>

    <div class="results-panel-three">
        <div class="metric-tile" style="border-top: 3px solid var(--brand-primary)">
            <span class="metric-label">Net Cost</span>
            <span class="metric-value" id="valNetCost">AED 0.00</span>
        </div>

        <div class="metric-tile" style="border-top: 3px solid var(--brand-warning)">
            <span class="metric-label">Rec. Price</span>
            <span class="metric-value" id="valSellingPrice" style="color:var(--brand-warning);">AED 0.00</span>
        </div>

        <div class="metric-tile" style="border-top: 3px solid var(--brand-success)">
            <span class="metric-label">Net Profit</span>
            <span class="metric-value" id="valProfitAmount" style="color:var(--brand-success);">AED 0.00</span>
        </div>
    </div>

    <div class="chart-container">
        <div class="chart-bar-wrapper">
            <div class="chart-bar-label-row">
                <span>Cost Component</span>
                <span id="pctBarCost">0%</span>
            </div>
            <div class="chart-bar-bg"><div id="barCost" class="chart-bar-fill cost"></div></div>
        </div>
        <div class="chart-bar-wrapper">
            <div class="chart-bar-label-row">
                <span>Rebate Provision</span>
                <span id="pctBarRebate">0%</span>
            </div>
            <div class="chart-bar-bg"><div id="barRebate" class="chart-bar-fill rebate"></div></div>
        </div>
        <div class="chart-bar-wrapper">
            <div class="chart-bar-label-row">
                <span>Retained Margin</span>
                <span id="pctBarProfit">0%</span>
            </div>
            <div class="chart-bar-bg"><div id="barProfit" class="chart-bar-fill profit"></div></div>
        </div>
    </div>
</div>

<script>
    const el = {
        outerSize: document.getElementById('outerSize'),
        outerCost: document.getElementById('outerCost'),
        unitCost: document.getElementById('unitCost'),
        costDiscount: document.getElementById('costDiscount'),
        txtCostDiscount: document.getElementById('txtCostDiscount'),
        targetMargin: document.getElementById('targetMargin'),
        txtMargin: document.getElementById('txtMargin'),
        salesDeduction: document.getElementById('salesDeduction'),
        txtDeduction: document.getElementById('txtDeduction'),
        sellingPrice: document.getElementById('sellingPrice'),
        
        valNetCost: document.getElementById('valNetCost'),
        valSellingPrice: document.getElementById('valSellingPrice'),
        valProfitAmount: document.getElementById('valProfitAmount'),
        
        barCost: document.getElementById('barCost'),
        barRebate: document.getElementById('barRebate'),
        barProfit: document.getElementById('barProfit'),
        pctBarCost: document.getElementById('pctBarCost'),
        pctBarRebate: document.getElementById('pctBarRebate'),
        pctBarProfit: document.getElementById('pctBarProfit')
    };

    const num = v => parseFloat(v) || 0;

    function getNetUnitCost() {
        return num(el.unitCost.value) * (1 - num(el.costDiscount.value) / 100);
    }

    function updateLabelBadges() {
        el.txtCostDiscount.textContent = num(el.costDiscount.value).toFixed(1) + "%";
        el.txtDeduction.textContent = num(el.salesDeduction.value).toFixed(1) + "%";
        el.txtMargin.textContent = num(el.targetMargin.value).toFixed(1) + "%";
    }

    function resetCalculator() {
        ['outerCost', 'unitCost', 'costDiscount', 'targetMargin', 'sellingPrice'].forEach(id => {
            el[id].value = "";
        });
        el.outerSize.value = "1";
        el.salesDeduction.value = "18";
        updateLabelBadges();
        runEngineFromCoreParameters();
    }

    function runEngineFromCoreParameters() {
        const cost = getNetUnitCost();
        const margin = num(el.targetMargin.value) / 100;
        const deduction = num(el.salesDeduction.value) / 100;

        el.valNetCost.textContent = `AED ${cost.toFixed(2)}`;

        const divisor = 1 - deduction - margin;
        if (divisor <= 0 || (cost === 0 && margin === 0 && deduction === 0)) {
            el.sellingPrice.value = "";
            el.valSellingPrice.textContent = "AED 0.00";
            el.valProfitAmount.textContent = "AED 0.00";
            updateVisualCharts(0, 0, 0, 0);
            return;
        }

        const price = cost / divisor;
        el.sellingPrice.value = price.toFixed(2);
        
        const profit = price - (price * deduction) - cost;
        
        el.valSellingPrice.textContent = `AED ${price.toFixed(2)}`;
        el.valProfitAmount.textContent = `AED ${profit.toFixed(2)}`;

        updateVisualCharts(price, cost, price * deduction, profit);
    }

    function runEngineFromOverridingPrice() {
        const price = num(el.sellingPrice.value);
        const cost = getNetUnitCost();
        const deduction = num(el.salesDeduction.value) / 100;

        el.valNetCost.textContent = `AED ${cost.toFixed(2)}`;

        if (price <= 0) {
            el.targetMargin.value = "";
            el.txtMargin.textContent = "0.0%";
            el.valSellingPrice.textContent = "AED 0.00";
            el.valProfitAmount.textContent = "AED 0.00";
            updateVisualCharts(0, 0, 0, 0);
            return;
        }

        const rebateAmount = price * deduction;
        const profit = price - rebateAmount - cost;
        const marginPct = (price > 0) ? (profit / price) * 100 : 0;

        el.targetMargin.value = marginPct.toFixed(1);
        el.txtMargin.textContent = marginPct.toFixed(1) + "%";

        el.valSellingPrice.textContent = `AED ${price.toFixed(2)}`;
        el.valProfitAmount.textContent = `AED ${profit.toFixed(2)}`;

        updateVisualCharts(price, cost, rebateAmount, profit);
    }

    function updateVisualCharts(totalPrice, cost, rebate, profit) {
        if (totalPrice <= 0) {
            ['barCost', 'barRebate', 'barProfit'].forEach(b => el[b].style.width = "0%");
            ['pctBarCost', 'pctBarRebate', 'pctBarProfit'].forEach(p => el[p].textContent = "0%");
            return;
        }

        const pCost = Math.max(0, (cost / totalPrice) * 100);
        const pRebate = Math.max(0, (rebate / totalPrice) * 100);
        const pProfit = (profit / totalPrice) * 100;

        el.barCost.style.width = `${pCost}%`;
        el.barRebate.style.width = `${pRebate}%`;
        el.barProfit.style.width = `${Math.max(0, pProfit)}%`;

        el.pctBarCost.textContent = `${pCost.toFixed(0)}%`;
        el.pctBarRebate.textContent = `${pRebate.toFixed(0)}%`;
        el.pctBarProfit.textContent = `${pProfit.toFixed(0)}%`;
    }

    el.outerSize.addEventListener('input', () => {
        const size = num(el.outerSize.value);
        if (size > 0) el.unitCost.value = (num(el.outerCost.value) / size).toFixed(2);
        runEngineFromCoreParameters();
    });

    el.outerCost.addEventListener('input', () => {
        const size = num(el.outerSize.value);
        if (size > 0) el.unitCost.value = (num(el.outerCost.value) / size).toFixed(2);
        runEngineFromCoreParameters();
    });

    el.unitCost.addEventListener('input', () => {
        el.outerSize.value = "";
        el.outerCost.value = "";
        runEngineFromCoreParameters();
    });

    ['costDiscount', 'targetMargin', 'salesDeduction'].forEach(id => {
        el[id].addEventListener('input', () => {
            updateLabelBadges();
            runEngineFromCoreParameters();
        });
    });

    el.sellingPrice.addEventListener('input', runEngineFromOverridingPrice);

    window.onload = () => {
        updateLabelBadges();
        runEngineFromCoreParameters();
    };
</script>
</body>
</html>
