<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Container Loading Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #121212;
      color: #eaeaea;
    }
    #sidebar {
      width: 360px;
      min-width: 320px;
      background: #1e1e1e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      border-right: 1px solid #333;
      z-index: 10;
    }
    h2 {
      font-size: 1.15rem;
      color: #fff;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    input, select {
      background: #0f0f0f;
      border: 1px solid #383838;
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
      width: 100%;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      outline: none;
    }
    .stats-card {
      background: #171717;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
      padding: 14px;
      margin-top: 6px;
    }
    .stats-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #3b82f6;
      margin-bottom: 10px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 5px 0;
      border-bottom: 1px solid #262626;
    }
    .stat-row:last-child {
      border-bottom: none;
    }
    .stat-val {
      font-weight: 600;
      color: #10b981;
    }
    #viewport-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #262626 0%, #0d0d0d 100%);
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #controls-hint {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #888;
      pointer-events: none;
    }
  </style>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="sidebar">
    <h2>Cargo Load Planner</h2>

    <div class="form-group">
      <label for="containerType">Container Standard</label>
      <select id="containerType">
        <option value="20ft">20 ft Standard (5.89m × 2.35m × 2.39m)</option>
        <option value="40ft" selected>40 ft Standard (12.03m × 2.35m × 2.39m)</option>
        <option value="40ftHC">40 ft High Cube (12.03m × 2.35m × 2.69m)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Box Dimensions (cm)</label>
      <div class="input-row">
        <div>
          <label style="font-size:0.75rem;">Length (L)</label>
          <input type="number" id="boxL" value="31.5" min="1" step="0.5">
        </div>
        <div>
          <label style="font-size:0.75rem;">Width (W)</label>
          <input type="number" id="boxW" value="46.5" min="1" step="0.5">
        </div>
        <div>
          <label style="font-size:0.75rem;">Height (H)</label>
          <input type="number" id="boxH" value="35.0" min="1" step="0.5">
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="gap">Inter-Box Gap / Margin (cm)</label>
      <input type="number" id="gap" value="0.5" min="0" step="0.1">
    </div>

    <div class="stats-card">
      <div class="stats-title">Packing Calculation</div>
      <div class="stat-row">
        <span>Total Boxes Fitted:</span>
        <span class="stat-val" id="totalBoxes">0</span>
      </div>
      <div class="stat-row">
        <span>Grid (L × W × H):</span>
        <span class="stat-val" id="gridCount">0 × 0 × 0</span>
      </div>
      <div class="stat-row">
        <span>Container Volume:</span>
        <span class="stat-val" id="containerVol">0.00 m³</span>
      </div>
      <div class="stat-row">
        <span>Cargo Volume Used:</span>
        <span class="stat-val" id="cargoVol">0.00 m³</span>
      </div>
      <div class="stat-row">
        <span>Space Utilization:</span>
        <span class="stat-val" id="volUtilization">0.0%</span>
      </div>
    </div>
  </div>

  <div id="viewport-container">
    <div id="canvas-container"></div>
    <div id="controls-hint">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const CONTAINERS = {
        "20ft":   { l: 5.898,  w: 2.352, h: 2.393 },
        "40ft":   { l: 12.032, w: 2.352, h: 2.393 },
        "40ftHC": { l: 12.032, w: 2.352, h: 2.698 }
      };

      const containerEl = document.getElementById('canvas-container');
      const width = containerEl.clientWidth || (window.innerWidth - 360);
      const height = containerEl.clientHeight || window.innerHeight;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
      camera.position.set(12, 10, 16);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(window.devicePixelRatio);
      containerEl.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dLight.position.set(20, 30, 20);
      scene.add(dLight);

      // Floor grid
      const grid = new THREE.GridHelper(25, 25, 0x444444, 0x222222);
      scene.add(grid);

      const containerFrameGroup = new THREE.Group();
      let boxesInstancedMesh = null;
      scene.add(containerFrameGroup);

      function updateSimulator() {
        const cType = document.getElementById('containerType').value;
        const cDim = CONTAINERS[cType];

        const boxL = Math.max(0.01, parseFloat(document.getElementById('boxL').value) / 100);
        const boxW = Math.max(0.01, parseFloat(document.getElementById('boxW').value) / 100);
        const boxH = Math.max(0.01, parseFloat(document.getElementById('boxH').value) / 100);
        const gap  = Math.max(0, parseFloat(document.getElementById('gap').value) / 100);

        while(containerFrameGroup.children.length > 0){ 
          containerFrameGroup.remove(containerFrameGroup.children[0]); 
        }
        if (boxesInstancedMesh) {
          scene.remove(boxesInstancedMesh);
          boxesInstancedMesh.geometry.dispose();
          boxesInstancedMesh.material.dispose();
          boxesInstancedMesh = null;
        }

        // Render Container Outline
        const contGeo = new THREE.BoxGeometry(cDim.l, cDim.h, cDim.w);
        const edges = new THREE.EdgesGeometry(contGeo);
        const wireframe = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 2 }));
        const walls = new THREE.Mesh(contGeo, new THREE.MeshBasicMaterial({ color: 0x1e3a8a, transparent: true, opacity: 0.08, depthWrite: false }));

        wireframe.position.set(0, cDim.h / 2, 0);
        walls.position.set(0, cDim.h / 2, 0);
        containerFrameGroup.add(wireframe);
        containerFrameGroup.add(walls);

        // Calculate Packing
        const countX = Math.floor((cDim.l + gap) / (boxL + gap));
        const countY = Math.floor((cDim.h + gap) / (boxH + gap));
        const countZ = Math.floor((cDim.w + gap) / (boxW + gap));
        const totalBoxes = Math.max(0, countX * countY * countZ);

        if (totalBoxes > 0) {
          const boxGeo = new THREE.BoxGeometry(boxL, boxH, boxW);
          const boxMat = new THREE.MeshLambertMaterial({ color: 0xd97706, transparent: true, opacity: 0.9 });
          boxesInstancedMesh = new THREE.InstancedMesh(boxGeo, boxMat, totalBoxes);
          const dummy = new THREE.Object3D();

          const startX = -(countX * boxL + (countX - 1) * gap) / 2 + boxL / 2;
          const startY = boxH / 2;
          const startZ = -(countZ * boxW + (countZ - 1) * gap) / 2 + boxW / 2;

          let idx = 0;
          for (let x = 0; x < countX; x++) {
            for (let y = 0; y < countY; y++) {
              for (let z = 0; z < countZ; z++) {
                dummy.position.set(
                  startX + x * (boxL + gap),
                  startY + y * (boxH + gap),
                  startZ + z * (boxW + gap)
                );
                dummy.updateMatrix();
                boxesInstancedMesh.setMatrixAt(idx++, dummy.matrix);
              }
            }
          }
          boxesInstancedMesh.instanceMatrix.needsUpdate = true;
          scene.add(boxesInstancedMesh);
        }

        // Analytics
        const contVol = cDim.l * cDim.w * cDim.h;
        const cargoVol = totalBoxes * (boxL * boxW * boxH);
        document.getElementById('totalBoxes').innerText = totalBoxes.toLocaleString();
        document.getElementById('gridCount').innerText = `${countX} × ${countZ} × ${countY}`;
        document.getElementById('containerVol').innerText = `${contVol.toFixed(2)} m³`;
        document.getElementById('cargoVol').innerText = `${cargoVol.toFixed(2)} m³`;
        document.getElementById('volUtilization').innerText = `${((cargoVol / contVol) * 100).toFixed(1)}%`;
      }

      ['containerType', 'boxL', 'boxW', 'boxH', 'gap'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateSimulator);
      });

      function onResize() {
        const w = containerEl.clientWidth || (window.innerWidth - 360);
        const h = containerEl.clientHeight || window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      window.addEventListener('resize', onResize);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      updateSimulator();
      animate();
      setTimeout(onResize, 100);
    });
  </script>
</body>
</html>
