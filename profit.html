<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>Orders & Inventory</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            /* Apple HIG Light Palette */
            --apple-bg: #F2F2F7;
            --apple-surface: rgba(255, 255, 255, 0.88);
            --apple-surface-card: #FFFFFF;
            --apple-surface-subtle: #F9F9FB;
            --apple-divider: rgba(60, 60, 67, 0.12);
            --apple-border: rgba(60, 60, 67, 0.18);
            --apple-text: #1C1C1E;
            --apple-secondary: #8E8E93;
            --apple-tertiary: #C7C7CC;
            --apple-blue: #007AFF;
            --apple-blue-hover: #0062CC;
            --apple-blue-tint: rgba(0, 122, 255, 0.12);
            --apple-green: #34C759;
            --apple-green-tint: rgba(52, 199, 89, 0.12);
            --apple-orange: #FF9500;
            --apple-red: #FF3B30;
            --apple-red-tint: rgba(255, 59, 48, 0.12);
            --apple-fill: rgba(120, 120, 128, 0.08);
            --apple-fill-hover: rgba(120, 120, 128, 0.14);
            
            --apple-card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 0.5px 1.5px rgba(0, 0, 0, 0.03);
            --apple-popover-shadow: 0 14px 34px rgba(0, 0, 0, 0.16), 0 2px 6px rgba(0, 0, 0, 0.08);
            --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            --apple-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
        }

        /* Apple Alternate Color Accents */
        body.theme-flamingo {
            --apple-blue: #30B0C7;
            --apple-blue-tint: rgba(48, 176, 199, 0.12);
            --apple-blue-hover: #258D9F;
        }

        body.theme-forest {
            --apple-blue: #28CD41;
            --apple-blue-tint: rgba(40, 205, 65, 0.12);
            --apple-blue-hover: #22A835;
        }

        body.theme-darkgreen {
            --apple-blue: #006039;
            --apple-blue-tint: rgba(0, 96, 57, 0.14);
            --apple-blue-hover: #004d2e;
        }

        body.theme-black {
            --apple-blue: #000000;
            --apple-blue-tint: rgba(0, 0, 0, 0.12);
            --apple-blue-hover: #222222;
        }

        body.theme-darkblue {
            --apple-blue: #002244;
            --apple-blue-tint: rgba(0, 34, 68, 0.14);
            --apple-blue-hover: #001730;
        }

        /* Font Overrides */
        body.font-jakarta { font-family: 'Plus Jakarta Sans', var(--apple-font); }
        body.font-inter { font-family: 'Inter', var(--apple-font); }
        body.font-roboto { font-family: 'Roboto', var(--apple-font); }
        body.font-mono { font-family: var(--apple-mono); }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body { 
            background: var(--apple-bg); 
            margin: 0; 
            padding: 12px 14px 60px 14px; 
            color: var(--apple-text);
            font-family: var(--apple-font);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            letter-spacing: -0.011em;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Glassmorphic Apple Navigation Bar */
        .header { 
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px; 
            background: var(--apple-surface);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            padding: 10px 16px; 
            border-radius: 16px; 
            border: 0.5px solid var(--apple-border);
            box-shadow: var(--apple-card-shadow);
            position: relative;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header h2 { 
            margin: 0; 
            font-size: 1.05rem; 
            font-weight: 700; 
            color: var(--apple-text);
            letter-spacing: -0.02em; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        /* Controls Dropdown Container */
        .controls-dropdown-wrapper {
            position: relative;
        }

        .controls-panel {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: min(340px, 90vw);
            background: var(--apple-surface-card);
            border: 0.5px solid var(--apple-border);
            border-radius: 16px;
            box-shadow: var(--apple-popover-shadow);
            z-index: 2500;
            padding: 12px;
            animation: popoverFade 0.15s ease-out;
        }
        .controls-panel.show {
            display: block;
        }

        /* Controls 2-Column Grid with full alignment */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
        }

        .controls-grid .btn,
        .controls-grid .apple-select-wrap,
        .controls-grid .ctrl-item {
            width: 100% !important;
            height: 36px !important;
            min-height: 36px !important;
            margin: 0 !important;
            box-sizing: border-box !important;
            font-size: 0.74rem !important;
        }

        .apple-select-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--apple-fill);
            padding: 0 10px;
            border-radius: 10px;
            border: 0.5px solid transparent;
            transition: all 0.2s ease;
        }
        .apple-select-wrap:focus-within {
            background: var(--apple-surface-card);
            border-color: var(--apple-border);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }
        .apple-select-wrap label {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--apple-secondary);
            text-transform: none;
            letter-spacing: normal;
            flex-shrink: 0;
        }
        .apple-select {
            width: 100%;
            height: 100%;
            padding: 0 16px 0 2px;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--apple-text);
            border: none;
            background: transparent;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E8E93' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 2px center;
            background-size: 10px;
        }

        /* Non-overlapping Columns Selector Drawer */
        .column-drawer {
            grid-column: span 2;
            display: none;
            flex-direction: row;
            justify-content: space-around;
            background: var(--apple-fill);
            border-radius: 10px;
            padding: 8px 10px;
            border: 0.5px solid var(--apple-divider);
            margin-top: 2px;
        }
        .column-drawer.show {
            display: flex;
        }
        .column-drawer label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--apple-text);
            cursor: pointer;
            margin: 0;
        }
        .column-drawer input[type="checkbox"] {
            accent-color: var(--apple-blue);
            margin: 0;
        }

        /* Apple Buttons */
        .btn { 
            cursor: pointer; 
            border: none; 
            border-radius: 10px; 
            font-weight: 600; 
            padding: 7px 12px; 
            font-size: 0.75rem; 
            min-height: 32px; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            background: var(--apple-fill);
            color: var(--apple-text);
            transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
            user-select: none;
            white-space: nowrap;
        }
        .btn:hover { background: var(--apple-fill-hover); }
        .btn:active { transform: scale(0.97); opacity: 0.85; }

        .btn-primary {
            background: var(--apple-blue);
            color: #FFFFFF;
        }
        .btn-primary:hover { background: var(--apple-blue-hover); }

        .btn-destructive {
            background: var(--apple-red-tint);
            color: var(--apple-red);
        }
        .btn-destructive:hover {
            background: rgba(255, 59, 48, 0.2);
        }

        .btn-tinted {
            background: var(--apple-blue-tint);
            color: var(--apple-blue);
            font-weight: 600;
        }
        .btn-tinted:hover {
            background: rgba(0, 122, 255, 0.18);
        }

        .btn-header-shortcut {
            background: var(--apple-text);
            color: #FFFFFF;
            min-height: 32px;
            padding: 6px 14px;
            font-size: 0.75rem;
            border-radius: 980px;
        }
        .btn-header-shortcut:hover {
            background: #000;
        }

        /* Apple Grouped Card */
        .workspace-row { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
        .top-full, .bottom-full { width: 100%; }

        .card { 
            background: var(--apple-surface-card); 
            padding: 14px; 
            border-radius: 18px; 
            border: 0.5px solid var(--apple-border);
            box-shadow: var(--apple-card-shadow);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 0.5px solid var(--apple-divider);
            margin-bottom: 12px;
        }

        .inventory-title-centered { font-weight: 700; font-size: 0.95rem; color: var(--apple-text); letter-spacing: -0.015em; }

        /* Apple Native Search Field */
        .filter-search-wrapper {
            position: sticky;
            top: 10px;
            z-index: 40;
            margin-bottom: 12px;
            width: 100%;
        }
        .filter-search-container {
            display: flex;
            align-items: center;
            position: relative;
            width: 100%;
            background: var(--apple-fill);
            border-radius: 12px;
            border: 0.5px solid transparent;
            transition: all 0.2s ease;
        }
        .filter-search-container:focus-within {
            background: var(--apple-surface-card);
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }
        .filter-search-container input[type="text"] {
            width: 100%;
            height: 36px;
            padding-right: 68px;
            padding-left: 32px;
            border: none;
            background: transparent;
            font-size: 0.82rem;
            color: var(--apple-text);
            font-family: inherit;
        }
        .search-icon-prefix {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--apple-secondary);
            pointer-events: none;
            display: flex;
            align-items: center;
        }
        .btn-clear-search {
            position: absolute;
            right: 34px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: var(--apple-tertiary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 0.65rem;
            transition: background 0.15s;
        }
        .btn-clear-search:hover { background: var(--apple-secondary); }
        .btn-scan-barcode {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-scan-barcode svg { width: 17px; height: 17px; fill: var(--apple-blue); }

        /* Segmented Control Bar (Apple Tabs) */
        .segmented-control {
            display: flex;
            background: var(--apple-fill);
            padding: 3px;
            border-radius: 11px;
            margin-bottom: 14px;
            border: 0.5px solid var(--apple-divider);
            gap: 2px;
        }
        .segment-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 6px 12px;
            font-size: 0.76rem;
            font-weight: 500;
            color: var(--apple-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }
        .segment-btn.active {
            background: var(--apple-surface-card);
            color: var(--apple-text);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08), 0 0.5px 1px rgba(0, 0, 0, 0.04);
        }
        .segment-badge {
            background: var(--apple-blue);
            color: #FFFFFF;
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 980px;
            font-weight: 700;
        }

        /* Apple Form Controls */
        .form-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .form-unit { width: 100%; display: flex; flex-direction: column; }
        .form-group { width: 100%; display: flex; flex-direction: column; }
        
        label { 
            font-size: 0.7rem; 
            font-weight: 600; 
            color: var(--apple-secondary); 
            margin-bottom: 5px; 
            letter-spacing: -0.01em;
        }
        
        input[type="text"], input[type="number"], select, textarea { 
            width: 100%; 
            padding: 8px 12px; 
            border: 0.5px solid var(--apple-border); 
            border-radius: 10px; 
            font-size: 0.82rem; 
            background: var(--apple-surface-card); 
            color: var(--apple-text);
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input[type="text"], input[type="number"], select { height: 36px; }
        textarea { resize: vertical; padding: 10px; font-family: var(--apple-mono); }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.18);
        }

        .tab-panel { display: none; opacity: 0; }
        .tab-panel.active { display: block; opacity: 1; animation: appleFadeIn 0.25s ease-out; }

        @keyframes appleFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Apple Inset Tables */
        .table-container, .inventory-table-container { 
            overflow-x: auto; 
            max-height: 480px; 
            overflow-y: auto; 
            border-radius: 12px;
            border: 0.5px solid var(--apple-divider);
            background: var(--apple-surface-card);
        }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        
        th { 
            position: sticky; 
            top: 0; 
            background: var(--apple-surface-subtle); 
            text-align: left; 
            padding: 8px 12px; 
            font-size: 0.68rem; 
            font-weight: 600;
            color: var(--apple-secondary); 
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 0.5px solid var(--apple-divider); 
            z-index: 10; 
            white-space: nowrap; 
        }
        td { 
            padding: 9px 12px; 
            border-bottom: 0.5px solid var(--apple-divider); 
            font-size: 0.8rem; 
            white-space: nowrap; 
            box-sizing: border-box; 
            color: var(--apple-text);
        }
        
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: var(--apple-fill); }

        td.wrap-cell { 
            white-space: normal; 
            word-break: break-word; 
            font-size: 0.78rem; 
            line-height: 1.35; 
        }
        .sub-meta-text { 
            display: block; 
            font-size: 0.7rem; 
            color: var(--apple-secondary); 
            font-family: var(--apple-mono); 
            margin-top: 2px; 
        }

        .col-id, .col-actions { display: none; }

        /* Apple Dot Indicator */
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .status-dot.green { background-color: var(--apple-green); }
        .status-dot.orange { background-color: var(--apple-orange); }
        .status-dot.red { background-color: var(--apple-red); }

        /* Apple iOS Style Stepper */
        .stepper-container {
            display: inline-flex;
            align-items: center;
            border-radius: 8px;
            background: var(--apple-fill);
            overflow: hidden;
            padding: 2px;
        }
        .stepper-btn {
            background: transparent;
            border: none;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            color: var(--apple-text);
            font-size: 0.85rem;
            user-select: none;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .stepper-btn:hover { background: var(--apple-surface-card); }
        .stepper-input {
            width: 38px !important;
            height: 24px !important;
            border: none !important;
            background: transparent !important;
            text-align: center;
            font-weight: 600;
            font-family: var(--apple-mono);
            padding: 0 !important;
            font-size: 0.78rem;
            color: var(--apple-text);
        }

        /* Table Footer Calculation Cards */
        tfoot {
            position: sticky;
            bottom: 0;
            background: var(--apple-surface-subtle);
            z-index: 10;
        }
        tfoot td { border-top: 0.5px solid var(--apple-divider); padding: 8px 12px; }
        .footer-metric-label { font-size: 0.68rem; text-transform: uppercase; color: var(--apple-secondary); font-weight: 600; }
        .footer-metric-val { font-weight: 600; color: var(--apple-text); font-family: var(--apple-mono); font-size: 0.84rem; }
        .grand-total-row td { background: var(--apple-blue-tint); }
        .grand-total-row .footer-metric-label { color: var(--apple-blue); font-weight: 700; }
        .grand-total-row .footer-metric-val { color: var(--apple-blue); font-weight: 700; font-size: 0.9rem; }

        /* Quick Action Icon Buttons */
        .btn-icon-round {
            width: 28px;
            height: 28px;
            min-height: 28px;
            padding: 0;
            border-radius: 50%;
            background: var(--apple-fill);
            color: var(--apple-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-icon-round:hover {
            background: var(--apple-fill-hover);
        }
        .btn-icon-round.accent {
            background: var(--apple-blue-tint);
            color: var(--apple-blue);
        }
        .btn-icon-round.destructive {
            background: var(--apple-red-tint);
            color: var(--apple-red);
        }

        /* Apple Popover Menu */
        .saved-orders-panel {
            display: none;
            position: absolute;
            background: var(--apple-surface-card);
            border: 0.5px solid var(--apple-divider);
            border-radius: 12px;
            box-shadow: var(--apple-popover-shadow);
            z-index: 160;
            padding: 6px;
            animation: popoverFade 0.15s ease-out;
        }
        @keyframes popoverFade {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .saved-orders-panel.show { display: block; }

        .saved-order-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--apple-text);
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.12s;
        }
        .saved-order-row:hover { background: var(--apple-fill); }

        /* Floating iOS Button at Bottom Center */
        .floating-scroll-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--apple-text);
            color: #FFFFFF;
            border: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            cursor: pointer;
            z-index: 2400;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s;
        }
        .floating-scroll-btn:hover { transform: translateX(-50%) scale(1.08); }

        /* Apple Dynamic Island / Capsule Toast */
        #toastContainer {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            min-width: 200px;
            padding: 8px 16px;
            border-radius: 980px;
            background: rgba(28, 28, 30, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            animation: toastSlideDown 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: center;
        }
        .toast.success { border: 0.5px solid rgba(52, 199, 89, 0.4); }
        .toast.error { border: 0.5px solid rgba(255, 59, 48, 0.4); }
        .toast.info { border: 0.5px solid rgba(0, 122, 255, 0.4); }

        @keyframes toastSlideDown {
            from { opacity: 0; transform: translateY(-12px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Apple Modal Dialog */
        .custom-dialog-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .custom-dialog {
            background: var(--apple-surface-card);
            border-radius: 18px;
            padding: 18px 20px;
            max-width: 320px;
            width: 100%;
            box-shadow: var(--apple-popover-shadow);
            border: 0.5px solid var(--apple-divider);
            text-align: center;
        }
        .custom-dialog h4 { margin: 0 0 6px 0; color: var(--apple-text); font-size: 0.95rem; font-weight: 700; }
        .custom-dialog p { margin: 0 0 16px 0; font-size: 0.78rem; color: var(--apple-secondary); line-height: 1.4; }
        .custom-dialog-actions { display: flex; gap: 8px; justify-content: center; }

        @media (min-width: 768px) {
            body { padding: 20px 24px 60px 24px; }
            .form-grid { flex-direction: row; flex-wrap: wrap; }
            .form-unit { flex: 1 1 calc(25% - 10px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            Order Form
        </h2>
        
        <div class="header-controls">
            <!-- Controls Trigger & Popover Panel -->
            <div class="controls-dropdown-wrapper">
                <button class="btn btn-tinted" id="btnToggleControls" onclick="toggleControlPanel(event)">
                    Controls ▾
                </button>
                
                <div class="controls-panel" id="headerControlPanel">
                    <div class="controls-grid">
                        <!-- Row 1: Lot & Accent -->
                        <div class="apple-select-wrap">
                            <label>Lot</label>
                            <select id="lotSizeSelector" class="apple-select">
                                <option value="1">1 pc</option>
                                <option value="6">6 pcs</option>
                                <option value="12" selected>12 pcs</option>
                                <option value="24">24 pcs</option>
                            </select>
                        </div>
                        <div class="apple-select-wrap">
                            <label>Accent</label>
                            <select id="themeSelector" class="apple-select" onchange="setTheme(this.value)">
                                <option value="default">Default Blue</option>
                                <option value="darkgreen">Dark Green</option>
                                <option value="black">Black</option>
                                <option value="darkblue">Dark Blue</option>
                                <option value="flamingo">Sky Cyan</option>
                                <option value="forest">Mint Green</option>
                            </select>
                        </div>

                        <!-- Row 2: Type & Status Filter -->
                        <div class="apple-select-wrap">
                            <label>Type</label>
                            <select id="fontSelector" class="apple-select" onchange="setFont(this.value)">
                                <option value="sf">San Francisco</option>
                                <option value="jakarta">Jakarta</option>
                                <option value="inter">Inter</option>
                                <option value="mono">SF Mono</option>
                            </select>
                        </div>
                        <div class="apple-select-wrap">
                            <label>Status</label>
                            <select id="statusFilter" class="apple-select" onchange="renderTable()">
                                <option value="All">All</option>
                                <option value="Active">Active & Reg</option>
                                <option value="Regular">Regular Only</option>
                                <option value="Blocked">Blocked</option>
                            </select>
                        </div>

                        <!-- Row 3: Import & Export -->
                        <label class="btn btn-tinted ctrl-item" title="Import CSV" style="cursor: pointer;">
                            ↑ Import CSV
                            <input type="file" id="csvInput" accept=".csv" style="display:none;" onchange="importCSV(event)">
                        </label>
                        <button class="btn btn-tinted ctrl-item" onclick="exportInventoryCSV()">↓ Export CSV</button>

                        <!-- Row 4: Columns Toggle & Catalog Clear -->
                        <button class="btn btn-tinted ctrl-item" onclick="toggleColumnDrawer(event)">Columns ▾</button>
                        <button class="btn btn-destructive ctrl-item" onclick="confirmClearInventory()">Clear Catalog</button>

                        <!-- Row 5: Column Checkbox Tray (Full Width Row) -->
                        <div class="column-drawer" id="columnDrawer">
                            <label onclick="stopPropagation(event)">
                                <input type="checkbox" id="chkToggleId" onchange="toggleColumnVisibility('id', this.checked)"> Item ID
                            </label>
                            <label onclick="stopPropagation(event)">
                                <input type="checkbox" id="chkToggleActions" onchange="toggleColumnVisibility('actions', this.checked)"> Actions
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <button class="btn btn-header-shortcut" onclick="scrollToOrders()">Orders</button>
        </div>
    </div>

    <!-- Product Catalog Card -->
    <div class="workspace-row">
        <div class="bottom-full">
            <div class="card">
                <div class="section-header">
                    <div class="inventory-title-centered">Product Catalog</div>
                </div>

                <div class="filter-search-wrapper" id="searchFieldWrapper">
                    <div class="filter-search-container">
                        <span class="search-icon-prefix">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                        <input type="text" id="tableFilter" placeholder="Search Code, Name, Barcode..." oninput="debouncedRenderTable()" onkeydown="handleSearchKeydown(event)">
                        <button class="btn-clear-search" onclick="clearSearchField()" title="Clear">✕</button>
                        <button class="btn-scan-barcode" onclick="triggerBarcodeScanner()" title="Scan Barcode">
                            <svg viewBox="0 0 24 24">
                                <path d="M4 4h3V2H4c-1.1 0-2 .9-2 2v3h2V4zm16-2h-3v2h3v3h2V4c0-1.1-.9-2-2-2zm2 16h-2v3h-3v2h4c1.1 0 2-.9 2-2v-3zM4 17H2v4c0 1.1.9 2 2 2h3v-2H4v-3zM6 6h2v12H6zm3 0h1v12H9zm3 0h2v12h-2zm3 0h3v12h-3zm4 0h1v12h-1z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Regular Filter Quick Action Bar -->
                <div id="regularQuickActionPanel" style="display: none; margin-bottom: 10px;">
                    <button class="btn btn-primary" style="width: 100%; border-radius: 10px;" onclick="addAllRegularItems()">
                        + Add All Filtered Regular Items to Worksheet
                    </button>
                </div>

                <div class="inventory-table-container">
                    <table id="inventoryTable">
                        <thead>
                            <tr>
                                <th class="col-id" style="width: 8%;">ID</th>
                                <th style="width: 35%;">Code / Barcode</th>
                                <th style="width: 65%;">Product Details</th>
                                <th class="col-actions" style="width: 10%;">Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Workspace Segments (Order, Details, Barcode) -->
    <div class="workspace-row">
        <div id="targetWorkspaceCard" class="top-full">
            <div class="card">
                <div class="segmented-control">
                    <button class="segment-btn active" id="tabOrderBtn" onclick="switchWorkspaceTab('order')">
                        Order <span class="segment-badge" id="orderCountBadge">0</span>
                    </button>
                    <button class="segment-btn" id="tabEntryBtn" onclick="switchWorkspaceTab('entry')">Details</button>
                    <button class="segment-btn" id="tabToolkitBtn" onclick="switchWorkspaceTab('toolkit')">Barcode</button>
                </div>
                
                <!-- Order Panel -->
                <div id="orderTabPanel" class="tab-panel active">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                        <div style="font-size: 0.88rem; font-weight: 700; color: var(--apple-text);">Active Order</div>
                        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                            <div style="position: relative;">
                                <button class="btn" onclick="toggleSavedOrdersPanel(event)" style="font-size: 0.72rem; padding: 5px 10px;">
                                    📁 Saved Orders ▾
                                </button>
                                <div class="saved-orders-panel" id="savedOrdersMenuPanel" style="top: 36px; left: 0; min-width: 220px;">
                                    <div id="savedOrdersListContainer"></div>
                                </div>
                            </div>
                            <button class="btn btn-tinted" onclick="promptSaveCurrentOrder()">Save</button>
                            <button class="btn btn-tinted" onclick="exportToExcel()">Export CSV</button>
                            <button class="btn btn-destructive" onclick="confirmClearTransactions()">Clear</button>
                        </div>
                    </div>

                    <div class="table-container">
                        <table id="transactionTable">
                            <thead>
                                <tr>
                                    <th style="width: 5%; text-align: center;">#</th>
                                    <th style="width: 25%;">Code</th>
                                    <th style="width: 40%;">Description</th>
                                    <th style="width: 15%; text-align: center;">Quantity</th>
                                    <th style="width: 15%; text-align: right;">Total</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="5" style="text-align: right;">
                                        <div style="display: inline-flex; align-items: center; gap: 8px;">
                                            <span class="footer-metric-label">Subtotal</span>
                                            <span class="footer-metric-val" id="footerTotalVal">0.00</span>
                                        </div>
                                    </td>
                                </tr>
                                <tr>
                                    <td colspan="5" style="text-align: right;">
                                        <div style="display: inline-flex; align-items: center; gap: 8px;">
                                            <span class="footer-metric-label">VAT (5%)</span>
                                            <span class="footer-metric-val" id="footerVatVal">0.00</span>
                                        </div>
                                    </td>
                                </tr>
                                <tr class="grand-total-row">
                                    <td colspan="5" style="text-align: right;">
                                        <div style="display: inline-flex; align-items: center; gap: 8px;">
                                            <span class="footer-metric-label">Grand Total</span>
                                            <span class="footer-metric-val" id="footerGrandTotalVal">0.00</span>
                                        </div>
                                    </td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>

                <!-- Details Panel -->
                <div id="entryTabPanel" class="tab-panel">
                    <div class="form-grid">
                        <div class="form-unit"><div class="form-group"><label>Item ID</label><input type="text" id="itemID"></div></div>
                        <div class="form-unit"><div class="form-group"><label>Code *</label><input type="text" id="itemCode"></div></div>
                        <div class="form-unit"><div class="form-group"><label>Barcode *</label><input type="text" id="barcode"></div></div>
                        <div class="form-unit"><div class="form-group"><label>Stock Level</label><input type="number" id="stock" placeholder="0"></div></div>
                        <div class="form-unit"><div class="form-group"><label>Description</label><input type="text" id="description"></div></div>
                        <div class="form-unit"><div class="form-group"><label>Cost Price</label><input type="number" id="price" step="0.01"></div></div>
                        <div class="form-unit"><div class="form-group"><label>Retail Price (RSP)</label><input type="number" id="rsp" step="0.01"></div></div>
                        <div class="form-unit">
                            <div class="form-group">
                                <label>Status</label>
                                <select id="status">
                                    <option value="Active">Active</option>
                                    <option value="Regular">Regular</option>
                                    <option value="Blocked">Blocked</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-unit" style="margin-top: 6px; display: flex; gap: 8px; flex-direction: row;">
                            <button class="btn btn-primary" id="btnSaveItem" onclick="addItem()" style="flex: 2; height: 38px;">Save Product</button>
                            <button class="btn btn-destructive" id="btnCancelEdit" onclick="cancelEdit()" style="flex: 1; height: 38px; display: none;">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- Barcode Panel -->
                <div id="toolkitTabPanel" class="tab-panel">
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div class="header-controls-left" style="gap: 8px; width: 100%;">
                            <button id="btnToggleToolkitScanner" class="btn btn-primary" style="flex: 2; height: 36px;" onclick="toggleToolkitScanner()">📷 Camera Scanner</button>
                            <label class="btn btn-tinted" style="flex: 1; height: 36px;" title="Import Column F">
                                ↑ Import Column F
                                <input type="file" id="toolkitExcelInput" accept=".csv,.txt" style="display:none;" onchange="importToolkitFile(event)">
                            </label>
                        </div>
                        
                        <div id="toolkitLiveReader" style="width: 100%; max-width: 360px; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #000; display: none; border: 0.5px solid var(--apple-border);"></div>
                        <div id="scanStatus" style="text-align: center; font-weight: 600; font-size: 0.75rem; color: var(--apple-secondary);"></div>

                        <div class="form-group">
                            <label>Scanned Codes Matrix</label>
                            <textarea id="barcodeInput" rows="3" placeholder="Scanned items will populate here..."></textarea>
                        </div>
                        
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-primary" style="flex: 2; height: 36px;" onclick="generateBarcodes()">Generate Labels</button>
                            <button class="btn btn-destructive" style="flex: 1; height: 36px;" onclick="clearToolkitBox()">Reset</button>
                        </div>

                        <div id="toolkitOutput" style="display: flex; flex-direction: row; align-items: center; overflow-x: auto; gap: 12px; padding: 10px 4px;"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Floating Navigation Arrow at Bottom Center -->
<button id="floatingScrollBtn" class="floating-scroll-btn" onclick="handleFloatingScroll()" title="Scroll">↓</button>

<!-- Dynamic Island Toast Container -->
<div id="toastContainer"></div>

<!-- Apple Style Action Confirmation Dialog -->
<div class="custom-dialog-backdrop" id="confirmDialogBackdrop">
    <div class="custom-dialog">
        <h4 id="dialogTitle">Confirmation</h4>
        <p id="dialogMessage">Are you sure you want to proceed?</p>
        <div class="custom-dialog-actions">
            <button class="btn" style="flex: 1;" onclick="closeConfirmDialog(false)">Cancel</button>
            <button class="btn btn-destructive" id="dialogConfirmBtn" style="flex: 1;" onclick="closeConfirmDialog(true)">Continue</button>
        </div>
    </div>
</div>

<!-- Barcode Scanner Modal Sheet -->
<div id="scannerModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; padding: 16px;">
    <div style="width: 100%; max-width: 360px; background: var(--apple-surface-card); border-radius: 20px; padding: 18px; box-shadow: var(--apple-popover-shadow); border: 0.5px solid var(--apple-divider); text-align: center;">
        <h4 style="margin: 0 0 12px 0; color: var(--apple-text); font-size: 0.9rem; font-weight: 700;">Scan Barcode</h4>
        <div id="interactive-reader" style="width: 100%; border-radius: 12px; overflow: hidden; background: #000;"></div>
        <button class="btn btn-destructive" style="width: 100%; margin-top: 14px; height: 36px;" onclick="closeBarcodeScanner()">Done</button>
    </div>
</div>

<script>
    let inventory = JSON.parse(localStorage.getItem('flamingo_db_v3')) || [];
    let transactions = JSON.parse(localStorage.getItem('flamingo_trans_v3')) || [];
    let savedOrdersMap = JSON.parse(localStorage.getItem('flamingo_saved_orders_map')) || {};
    let editingUniqueRef = null;
    let searchDebounceTimer = null;
    let pendingConfirmCallback = null;

    let visibleColumns = {
        id: false,
        actions: false
    };

    const elements = {
        itemID: document.getElementById('itemID'),
        itemCode: document.getElementById('itemCode'),
        barcode: document.getElementById('barcode'),
        description: document.getElementById('description'),
        price: document.getElementById('price'),
        rsp: document.getElementById('rsp'),
        stock: document.getElementById('stock'),
        status: document.getElementById('status'),
        tableFilter: document.getElementById('tableFilter'),
        statusFilter: document.getElementById('statusFilter'),
        lotSizeSelector: document.getElementById('lotSizeSelector'),
        inventoryTbody: document.querySelector("#inventoryTable tbody"),
        transactionTbody: document.querySelector("#transactionTable tbody"),
        footerTotalVal: document.getElementById('footerTotalVal'),
        footerVatVal: document.getElementById('footerVatVal'),
        footerGrandTotalVal: document.getElementById('footerGrandTotalVal'),
        csvInput: document.getElementById('csvInput'),
        toolkitExcelInput: document.getElementById('toolkitExcelInput'),
        themeSelector: document.getElementById('themeSelector'),
        fontSelector: document.getElementById('fontSelector'),
        orderCountBadge: document.getElementById('orderCountBadge'),
        btnSaveItem: document.getElementById('btnSaveItem'),
        btnCancelEdit: document.getElementById('btnCancelEdit'),
        savedOrdersListContainer: document.getElementById('savedOrdersListContainer'),
        regularQuickActionPanel: document.getElementById('regularQuickActionPanel')
    };

    const calcEl = {
        tabEntryBtn: document.getElementById("tabEntryBtn"),
        tabOrderBtn: document.getElementById("tabOrderBtn"),
        tabToolkitBtn: document.getElementById("tabToolkitBtn"),
        entryPanel: document.getElementById("entryTabPanel"),
        orderPanel: document.getElementById("orderTabPanel"),
        toolkitPanel: document.getElementById("toolkitTabPanel")
    };

    const scanStatus = document.getElementById('scanStatus');
    const toolkitTextarea = document.getElementById('barcodeInput');
    let toolkitLiveScanner = null;
    let lastScannedCode = "";
    let throttleTimeout = null;

    window.onload = () => { 
        if (elements.statusFilter) elements.statusFilter.value = "Active";

        const savedTheme = localStorage.getItem('flamingo_app_theme') || 'default';
        setTheme(savedTheme);

        const savedFont = localStorage.getItem('flamingo_app_font') || 'sf';
        setFont(savedFont);

        renderTable(); 
        renderTransactions(); 
        updateSavedOrdersDropdown();
        updateFloatingScrollButton();
        
        document.addEventListener("click", (e) => {
            const ctrlPanel = document.getElementById("headerControlPanel");
            const ctrlWrap = document.querySelector(".controls-dropdown-wrapper");
            if (ctrlPanel && ctrlWrap && !ctrlWrap.contains(e.target)) {
                ctrlPanel.classList.remove("show");
            }

            const savedOrdersMenu = document.getElementById("savedOrdersMenuPanel");
            const savedOrdersWrap = document.querySelector(".saved-orders-dropdown-wrap");
            if (savedOrdersMenu && savedOrdersWrap && !savedOrdersWrap.contains(e.target)) {
                savedOrdersMenu.classList.remove("show");
            }
        });

        window.addEventListener("scroll", () => {
            updateFloatingScrollButton();
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                const scannerModal = document.getElementById('scannerModal');
                if (scannerModal && scannerModal.style.display === 'flex') {
                    closeBarcodeScanner();
                } else if (toolkitLiveScanner) {
                    stopToolkitScanner();
                } else {
                    const ctrlPanel = document.getElementById("headerControlPanel");
                    if (ctrlPanel) ctrlPanel.classList.remove("show");
                    const savedMenu = document.getElementById("savedOrdersMenuPanel");
                    if (savedMenu) savedMenu.classList.remove("show");
                    if (document.activeElement === elements.tableFilter) {
                        clearSearchField();
                    }
                }
            }
        });
    };

    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerText = message;
        container.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-6px) scale(0.96)';
            toast.style.transition = 'all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
            setTimeout(() => toast.remove(), 200);
        }, 2200);
    }

    function openConfirmDialog(title, message, callback) {
        document.getElementById('dialogTitle').innerText = title;
        document.getElementById('dialogMessage').innerText = message;
        document.getElementById('confirmDialogBackdrop').style.display = 'flex';
        pendingConfirmCallback = callback;
    }

    function closeConfirmDialog(result) {
        document.getElementById('confirmDialogBackdrop').style.display = 'none';
        if (result && typeof pendingConfirmCallback === 'function') {
            pendingConfirmCallback();
        }
        pendingConfirmCallback = null;
    }

    function debouncedRenderTable() {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
            renderTable();
        }, 120);
    }

    function handleSearchKeydown(e) {
        if (e.key === "Enter") {
            const currentMatches = getFilteredInventory();
            if (currentMatches.length > 0) {
                addTrans(currentMatches[0].code);
                clearSearchField();
            }
        }
    }

    function setTheme(themeName) {
        document.body.classList.remove('theme-flamingo', 'theme-forest', 'theme-darkgreen', 'theme-black', 'theme-darkblue');
        if (themeName !== 'default') {
            document.body.classList.add('theme-' + themeName);
        }
        localStorage.setItem('flamingo_app_theme', themeName);
        if (elements.themeSelector) elements.themeSelector.value = themeName;
    }

    function setFont(fontName) {
        document.body.classList.remove('font-jakarta', 'font-inter', 'font-roboto', 'font-mono');
        if (fontName !== 'sf') {
            document.body.classList.add('font-' + fontName);
        }
        localStorage.setItem('flamingo_app_font', fontName);
        if (elements.fontSelector) elements.fontSelector.value = fontName;
    }

    function handleFloatingScroll() {
        const scrollMiddle = (document.documentElement.scrollHeight - window.innerHeight) / 2;
        if (window.scrollY < scrollMiddle) {
            window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
        } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function updateFloatingScrollButton() {
        const btn = document.getElementById('floatingScrollBtn');
        if (!btn) return;
        const totalScrollable = document.documentElement.scrollHeight - window.innerHeight;
        if (totalScrollable <= 0) {
            btn.style.display = 'none';
            return;
        }
        btn.style.display = 'flex';
        const scrollMiddle = totalScrollable / 2;
        if (window.scrollY < scrollMiddle) {
            btn.innerText = '↓';
            btn.title = 'Scroll to bottom';
        } else {
            btn.innerText = '↑';
            btn.title = 'Scroll to top';
        }
    }

    function toggleControlPanel(event) {
        if (event) event.stopPropagation();
        const panel = document.getElementById('headerControlPanel');
        panel.classList.toggle('show');
    }

    function toggleColumnDrawer(event) {
        if (event) event.stopPropagation();
        const drawer = document.getElementById('columnDrawer');
        drawer.classList.toggle('show');
    }

    function sync() {
        localStorage.setItem('flamingo_db_v3', JSON.stringify(inventory));
        localStorage.setItem('flamingo_trans_v3', JSON.stringify(transactions));
        renderTable();
    }

    function toggleSavedOrdersPanel(event) {
        event.stopPropagation();
        const panel = document.getElementById("savedOrdersMenuPanel");
        if (panel) panel.classList.toggle("show");
    }

    function stopPropagation(event) {
        event.stopPropagation();
    }

    function clearSearchField() {
        if (elements.tableFilter) {
            elements.tableFilter.value = "";
            renderTable();
            elements.tableFilter.focus();
        }
    }

    function toggleColumnVisibility(columnClass, isChecked) {
        visibleColumns[columnClass] = isChecked;
        const thElements = document.querySelectorAll(`#inventoryTable th.col-${columnClass}`);
        thElements.forEach(el => el.style.display = isChecked ? 'table-cell' : 'none');
        const tdElements = document.querySelectorAll(`#inventoryTable td.col-${columnClass}`);
        tdElements.forEach(el => el.style.display = isChecked ? 'table-cell' : 'none');
    }

    function switchWorkspaceTab(targetTab) {
        if(targetTab !== 'toolkit') stopToolkitScanner();

        [calcEl.tabEntryBtn, calcEl.tabOrderBtn, calcEl.tabToolkitBtn].forEach(btn => {
            if(btn) btn.classList.remove('active');
        });
        [calcEl.entryPanel, calcEl.orderPanel, calcEl.toolkitPanel].forEach(panel => {
            if(panel) panel.classList.remove('active');
        });

        if (targetTab === 'entry' && calcEl.tabEntryBtn && calcEl.entryPanel) {
            calcEl.tabEntryBtn.classList.add('active');
            calcEl.entryPanel.classList.add('active');
        } else if (targetTab === 'order' && calcEl.tabOrderBtn && calcEl.orderPanel) {
            calcEl.tabOrderBtn.classList.add('active');
            calcEl.orderPanel.classList.add('active');
        } else if (targetTab === 'toolkit' && calcEl.tabToolkitBtn && calcEl.toolkitPanel) {
            calcEl.tabToolkitBtn.classList.add('active');
            calcEl.toolkitPanel.classList.add('active');
        }
    }

    function editItem(barcode) {
        const item = inventory.find(i => i.barcode === barcode);
        if (item) {
            editingUniqueRef = item.uniqueRef;
            if(!visibleColumns.actions) {
                const chk = document.getElementById('chkToggleActions');
                if(chk) chk.checked = true;
                toggleColumnVisibility('actions', true);
            }
            switchWorkspaceTab('entry');
            elements.itemID.value = item.id;
            elements.itemCode.value = item.code;
            elements.barcode.value = item.barcode;
            elements.description.value = item.desc;
            elements.price.value = item.price;
            elements.rsp.value = item.rsp;
            elements.stock.value = item.stock;
            elements.status.value = item.status || "Active";
            
            if (elements.btnSaveItem) elements.btnSaveItem.innerText = "Update Product";
            if (elements.btnCancelEdit) elements.btnCancelEdit.style.display = "inline-flex";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function cancelEdit() {
        clearEntryForm();
        switchWorkspaceTab('order');
    }

    function addItem() {
        const codeVal = elements.itemCode.value.toUpperCase().trim();
        const barcodeVal = elements.barcode.value.trim();
        
        if (!codeVal || !barcodeVal) {
            showToast("Required: Code & Barcode", 'error');
            return;
        }

        const item = {
            uniqueRef: editingUniqueRef || (Date.now() + Math.random()),
            id: elements.itemID.value.trim(),
            code: codeVal,
            barcode: barcodeVal,
            desc: elements.description.value.trim(),
            price: parseFloat(elements.price.value || "0").toFixed(2),
            rsp: parseFloat(elements.rsp.value || "0").toFixed(2),
            stock: elements.stock.value || "0",
            status: elements.status.value
        };

        inventory = inventory.filter(i => i.barcode !== item.barcode && i.uniqueRef !== item.uniqueRef);
        inventory.push(item);
        sync();
        clearEntryForm();
        renderTransactions(); 
        showToast("Product saved successfully!", "success");
    }

    function clearEntryForm() {
        ['itemID', 'itemCode', 'barcode', 'description', 'price', 'rsp', 'stock'].forEach(id => {
            if(elements[id]) elements[id].value = "";
        });
        if(elements.status) elements.status.value = "Active";
        editingUniqueRef = null;
        if (elements.btnSaveItem) elements.btnSaveItem.innerText = "Save Product";
        if (elements.btnCancelEdit) elements.btnCancelEdit.style.display = "none";
    }

    function delItem(ref) { 
        openConfirmDialog("Delete Item", "Are you sure you want to permanently delete this product?", () => {
            inventory = inventory.filter(i => i.uniqueRef !== ref); 
            sync(); 
            renderTransactions(); 
            showToast("Item deleted", "info");
        });
    }

    function getFilteredInventory() {
        const filterInput = elements.tableFilter.value.toLowerCase().trim();
        const searchTokens = filterInput.split(/\s+/).filter(t => t.length > 0);
        const stat = elements.statusFilter.value;

        if (elements.regularQuickActionPanel) {
            elements.regularQuickActionPanel.style.display = (stat === "Regular") ? "block" : "none";
        }

        return inventory.filter(i => {
            if (stat === "Active") {
                if (i.status !== "Active" && i.status !== "Regular") return false;
            } else if (stat === "Regular") {
                if (i.status !== "Regular") return false;
            } else if (stat === "Blocked") {
                if (i.status !== "Blocked") return false;
            }

            if (searchTokens.length === 0) return true;
            const itemString = `${i.code} ${i.barcode} ${i.desc} ${i.id}`.toLowerCase();
            return searchTokens.every(token => itemString.includes(token));
        });
    }

    function renderTable() {
        const filtered = getFilteredInventory();
        let htmlBuffer = '';

        filtered.forEach(i => {
            let dotClass = 'status-dot green';
            if (i.status === 'Blocked') dotClass = 'status-dot red';
            else if (i.status === 'Regular') dotClass = 'status-dot orange';
            
            const idStyle = visibleColumns.id ? 'table-cell' : 'none';
            const actionsStyle = visibleColumns.actions ? 'table-cell' : 'none';

            const priceNum = Number(i.price).toFixed(2);
            const rspNum = Number(i.rsp).toFixed(2);
            const stockVal = i.stock || "0";

            htmlBuffer += `
                <tr>
                    <td class="col-id" style="display: ${idStyle}; font-family: var(--apple-mono);">${i.id}</td>
                    <td>
                        <div style="font-weight:600; font-family: var(--apple-mono); font-size: 0.78rem;">${i.code}</div>
                        <span class="sub-meta-text">${i.barcode}</span>
                    </td>
                    <td class="wrap-cell">
                        <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                            <div>
                                <span class="${dotClass}" title="${i.status}"></span>${i.desc}
                                <span class="sub-meta-text">
                                    <span style="color:var(--apple-blue); font-weight:600;">${priceNum}</span> · RSP: ${rspNum} · Stock: ${stockVal}
                                </span>
                            </div>
                            <button class="btn-icon-round accent" title="Add to Order" onclick="addTrans('${i.code}')">＋</button>
                        </div>
                    </td>
                    <td class="col-actions" style="display: ${actionsStyle};">
                        <div style="display:flex; gap:6px; align-items:center;">
                            <button class="btn-icon-round" title="Edit" onclick="editItem('${i.barcode}')">✎</button>
                            <button class="btn-icon-round destructive" title="Delete" onclick="delItem(${i.uniqueRef})">✕</button>
                        </div>
                    </td>
                </tr>`;
        });
        
        elements.inventoryTbody.innerHTML = htmlBuffer;
    }

    function addTrans(code) {
        const item = inventory.find(i => i.code === code);
        if (!item) return;

        const lotIncrement = parseInt(elements.lotSizeSelector.value) || 12;

        const existingIndex = transactions.findIndex(t => t.code === item.code);
        if (existingIndex !== -1) {
            const existingItem = transactions.splice(existingIndex, 1)[0];
            existingItem.qty = (Number(existingItem.qty) || 0) + lotIncrement;
            transactions.unshift(existingItem);
        } else {
            transactions.unshift({
                code: item.code,
                desc: item.desc,
                qty: lotIncrement,
                price: item.price,
                ref: Date.now() + Math.random()
            });
        }

        syncTransactions();
        showToast(`+${lotIncrement} added: ${item.code}`, "success");
    }

    function addAllRegularItems() {
        const filtered = getFilteredInventory();
        if (filtered.length === 0) {
            showToast("No regular items matching current filter", "error");
            return;
        }

        const lotIncrement = parseInt(elements.lotSizeSelector.value) || 12;

        filtered.forEach(item => {
            if (item.status === "Regular") {
                const existingIndex = transactions.findIndex(t => t.code === item.code);
                if (existingIndex !== -1) {
                    transactions[existingIndex].qty = (Number(transactions[existingIndex].qty) || 0) + lotIncrement;
                } else {
                    transactions.push({
                        code: item.code,
                        desc: item.desc,
                        qty: lotIncrement,
                        price: item.price,
                        ref: Date.now() + Math.random()
                    });
                }
            }
        });

        syncTransactions();
        showToast(`Added regular items (Lot: ${lotIncrement})`, "success");
    }

    function changeQtyStep(ref, delta) {
        const t = transactions.find(item => item.ref === ref);
        if (t) {
            let current = parseInt(t.qty) || 0;
            let next = current + delta;
            if (next <= 0) {
                remTrans(ref);
            } else {
                updateQty(ref, next);
            }
        }
    }

    function updateQty(ref, val) {
        const t = transactions.find(item => item.ref === ref);
        if (t) { 
            t.qty = Math.max(1, parseInt(val) || 1); 
            localStorage.setItem('flamingo_trans_v3', JSON.stringify(transactions)); 
            calculateGrandTotal();
            
            const rowTotalSpan = document.getElementById(`row-total-${ref}`);
            const inputField = document.getElementById(`qty-input-${ref}`);
            if(inputField) inputField.value = t.qty;

            if(rowTotalSpan) {
                const currentItem = inventory.find(i => i.code === t.code);
                const unitPrice = currentItem ? Number(currentItem.price) : (Number(t.price) || 0);
                rowTotalSpan.innerText = (unitPrice * Number(t.qty)).toFixed(2);
            }
        }
    }

    function syncTransactions() {
        localStorage.setItem('flamingo_trans_v3', JSON.stringify(transactions));
        renderTransactions();
    }

    function renderTransactions() {
        if (elements.orderCountBadge) {
            elements.orderCountBadge.innerText = transactions.length;
        }

        elements.transactionTbody.innerHTML = transactions.map((t, index) => {
            const currentItem = inventory.find(i => i.code === t.code);
            const unitPrice = currentItem ? Number(currentItem.price) : (Number(t.price) || 0);
            const lineTotal = unitPrice * Number(t.qty);
            
            return `
                <tr>
                    <td style="text-align: center; color: var(--apple-secondary); font-weight: 600; font-size: 0.72rem;">${index + 1}</td>
                    <td style="font-weight: 600; font-family: var(--apple-mono); font-size: 0.76rem;">${t.code}</td>
                    <td class="wrap-cell">
                        <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;">
                            <span>${t.desc}</span>
                            <button class="btn-icon-round destructive" style="width: 22px; height: 22px; min-height: 22px; font-size: 0.65rem;" title="Remove Item" onclick="remTrans(${t.ref})">✕</button>
                        </div>
                    </td>
                    <td style="text-align: center;">
                        <div class="stepper-container">
                            <button class="stepper-btn" onclick="changeQtyStep(${t.ref}, -1)">−</button>
                            <input type="number" id="qty-input-${t.ref}" class="stepper-input" value="${t.qty}" min="1" onchange="updateQty(${t.ref}, this.value)">
                            <button class="stepper-btn" onclick="changeQtyStep(${t.ref}, 1)">+</button>
                        </div>
                    </td>
                    <td style="text-align: right; font-weight: 600; font-family: var(--apple-mono); color: var(--apple-text);">
                        <span id="row-total-${t.ref}">${lineTotal.toFixed(2)}</span>
                    </td>
                </tr>`;
        }).join('');
        
        calculateGrandTotal();
    }

    function calculateGrandTotal() {
        let subtotal = 0;
        transactions.forEach(t => {
            const currentItem = inventory.find(i => i.code === t.code);
            const unitPrice = currentItem ? Number(currentItem.price) : (Number(t.price) || 0);
            subtotal += unitPrice * (Number(t.qty) || 0);
        });
        
        const vatTotal = subtotal * 0.05;
        const netGrandTotal = subtotal + vatTotal;

        if (elements.footerTotalVal) elements.footerTotalVal.innerText = subtotal.toFixed(2);
        if (elements.footerVatVal) elements.footerVatVal.innerText = vatTotal.toFixed(2);
        if (elements.footerGrandTotalVal) elements.footerGrandTotalVal.innerText = netGrandTotal.toFixed(2);
    }

    function remTrans(ref) { 
        transactions = transactions.filter(t => t.ref !== ref); 
        syncTransactions(); 
        showToast("Item removed", "info");
    }

    function confirmClearTransactions() {
        if (!transactions.length) return;
        openConfirmDialog("Clear Order", "Are you sure you want to clear all active orders?", () => {
            transactions = [];
            syncTransactions();
            showToast("Order cleared", "info");
        });
    }

    function confirmClearInventory() {
        if (!inventory.length) return;
        openConfirmDialog("Clear Entire Catalog", "Warning: This action will permanently delete all catalog products and barcode entries.", () => {
            inventory = [];
            sync();
            renderTransactions();
            showToast("Catalog wiped", "error");
        });
    }

    function promptSaveCurrentOrder() {
        if (!transactions.length) {
            showToast("Order is empty!", "error");
            return;
        }
        let orderName = prompt("Name this saved order:", "Order_" + new Date().toLocaleDateString());
        if (!orderName) return;
        orderName = orderName.trim();
        
        savedOrdersMap[orderName] = JSON.parse(JSON.stringify(transactions));
        localStorage.setItem('flamingo_saved_orders_map', JSON.stringify(savedOrdersMap));
        updateSavedOrdersDropdown();
        showToast(`Saved: "${orderName}"`, "success");
    }

    function updateSavedOrdersDropdown() {
        if (!elements.savedOrdersListContainer) return;
        let keys = Object.keys(savedOrdersMap);
        
        if (keys.length === 0) {
            elements.savedOrdersListContainer.innerHTML = '<div style="padding: 8px 12px; font-size: 0.72rem; color: var(--apple-secondary); text-align: center;">No saved orders</div>';
            return;
        }

        let html = '';
        keys.forEach(k => {
            html += `
                <div class="saved-order-row">
                    <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;" onclick="loadSavedOrder('${k.replace(/'/g, "\\'")}')" title="Click to load">${k} (${savedOrdersMap[k].length})</span>
                    <button class="btn-icon-round destructive" style="width: 20px; height: 20px; min-height: 20px; font-size: 0.65rem;" title="Delete" onclick="deleteSavedOrder(event, '${k.replace(/'/g, "\\'")}')">✕</button>
                </div>`;
        });
        elements.savedOrdersListContainer.innerHTML = html;
    }

    function loadSavedOrder(orderName) {
        if (savedOrdersMap[orderName]) {
            transactions = JSON.parse(JSON.stringify(savedOrdersMap[orderName]));
            syncTransactions();
            showToast(`Loaded: "${orderName}"`, "success");
        }
        const panel = document.getElementById("savedOrdersMenuPanel");
        if (panel) panel.classList.remove("show");
    }

    function deleteSavedOrder(event, orderName) {
        event.stopPropagation();
        openConfirmDialog("Delete Saved Order", `Delete saved order "${orderName}"?`, () => {
            delete savedOrdersMap[orderName];
            localStorage.setItem('flamingo_saved_orders_map', JSON.stringify(savedOrdersMap));
            updateSavedOrdersDropdown();
            showToast(`Deleted: "${orderName}"`, "info");
        });
    }

    function exportInventoryCSV() {
        const filtered = getFilteredInventory();
        if (!filtered.length) return showToast("No matching items to export!", "error");
        let csv = "ID,Code,Barcode,Description,Price,RSP,Stock,Status\n";
        filtered.forEach(i => {
            csv += `"${i.id}","${i.code}","${i.barcode}","${i.desc}","${i.price}","${i.rsp}","${i.stock}","${i.status}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Filtered_Inventory_Backup_${new Date().toLocaleDateString()}.csv`;
        link.click();
        showToast("Inventory exported", "success");
    }

    function exportToExcel() {
        if (!transactions.length) return showToast("No items in active order", "error");
        let filename = prompt("Enter Order Filename:", "Order_Worksheet");
        if (!filename) return; 

        let csvContent = "\uFEFF"; 
        csvContent += "Code,Description,Quantity\n"; 
        let sortedTransactions = [...transactions].sort((a, b) => Number(b.qty) - Number(a.qty));

        sortedTransactions.forEach(t => {
            const cleanedDescription = t.desc.replace(/"/g, '""');
            csvContent += `"${t.code}","${cleanedDescription}",${t.qty}\n`; 
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${filename.trim().replace(/[\/\?<>\\:\*\|"]/g, '_')}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast("Order exported", "success");
    }

    function parseCSVLine(text) {
        let p = '', r = [];
        let q = false;
        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            if (c === '"') { q = !q; }
            else if (c === ',' && !q) { r.push(p); p = ''; }
            else { p += c; }
        }
        r.push(p);
        return r;
    }

    function importCSV(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const lines = e.target.result.split(/\r?\n/);
            if(lines.length <= 1) return;

            let timestampBase = Date.now();
            let newItems = [];

            for (let i = 1; i < lines.length; i++) {
                const lineClean = lines[i].trim();
                if (!lineClean) continue; 
                
                const c = parseCSVLine(lineClean);
                if (c.length >= 6) {
                    newItems.push({
                        uniqueRef: timestampBase + i,
                        id: (c[0] || "").trim(), 
                        code: (c[1] || "").trim().toUpperCase(),
                        barcode: (c[2] || "").trim(), 
                        desc: (c[3] || "").trim(),
                        price: parseFloat((c[4] || "0").trim()).toFixed(2), 
                        rsp: parseFloat((c[5] || "0").trim()).toFixed(2), 
                        stock: (c[6] || "").trim() || "0", 
                        status: (c[7] || "").trim() || "Active"
                    });
                }
            }

            if(newItems.length > 0) {
                const barcodeMap = new Set(newItems.map(item => item.barcode));
                inventory = inventory.filter(i => !barcodeMap.has(i.barcode)).concat(newItems);
                sync();
                showToast(`Imported ${newItems.length} items`, "success");
            }
            if(elements.csvInput) elements.csvInput.value = "";
        };
        reader.readAsText(file);
    }

    let html5QrcodeScanner = null;
    function triggerBarcodeScanner() {
        const modal = document.getElementById('scannerModal');
        modal.style.display = 'flex';
        html5QrcodeScanner = new Html5Qrcode("interactive-reader");
        const config = { fps: 15, qrbox: { width: 220, height: 130 } };

        html5QrcodeScanner.start(
            { facingMode: "environment" }, 
            config,
            (decodedText) => {
                elements.tableFilter.value = decodedText.trim();
                renderTable();
                closeBarcodeScanner();
            },
            () => {}
        ).catch(err => {
            showToast("Camera error: " + err, "error");
            closeBarcodeScanner();
        });
    }

    function closeBarcodeScanner() {
        const modal = document.getElementById('scannerModal');
        modal.style.display = 'none';
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                html5QrcodeScanner.clear();
                html5QrcodeScanner = null;
            }).catch(() => { html5QrcodeScanner = null; });
        }
    }

    function toggleToolkitScanner() {
        const readerElement = document.getElementById('toolkitLiveReader');
        const btn = document.getElementById('btnToggleToolkitScanner');

        if (toolkitLiveScanner) {
            stopToolkitScanner();
            return;
        }

        readerElement.style.display = "block";
        btn.innerText = "Stop Camera";
        btn.className = "btn btn-destructive";
        scanStatus.innerText = "Align barcode within camera view...";

        toolkitLiveScanner = new Html5Qrcode("toolkitLiveReader");
        const config = { fps: 15, qrbox: { width: 240, height: 120 } };

        toolkitLiveScanner.start(
            { facingMode: "environment" }, 
            config,
            (decodedText) => {
                const scannedClean = decodedText.trim();
                if (scannedClean === lastScannedCode) return;
                lastScannedCode = scannedClean;

                clearTimeout(throttleTimeout);
                throttleTimeout = setTimeout(() => { lastScannedCode = ""; }, 2500);

                scanStatus.innerText = `Captured: ${scannedClean}`;

                let currentValue = toolkitTextarea.value;
                if (currentValue.length > 0 && !currentValue.endsWith('\n')) currentValue += '\n';
                toolkitTextarea.value = currentValue + scannedClean + '\n';
                
                generateBarcodes();
            },
            () => { }
        ).catch(err => {
            showToast("Camera access error: " + err, "error");
            stopToolkitScanner();
        });
    }

    function stopToolkitScanner() {
        const readerElement = document.getElementById('toolkitLiveReader');
        const btn = document.getElementById('btnToggleToolkitScanner');
        
        btn.innerText = "📷 Camera Scanner";
        btn.className = "btn btn-primary";
        scanStatus.innerText = "";
        readerElement.style.display = "none";

        if (toolkitLiveScanner) {
            toolkitLiveScanner.stop().then(() => {
                toolkitLiveScanner.clear();
                toolkitLiveScanner = null;
            }).catch(() => { toolkitLiveScanner = null; });
        }
    }

    function importToolkitFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const lines = e.target.result.split(/\r?\n/);
            let parsedCodes = [];
            const targetColumnIndex = 5; 

            for (let i = 0; i < lines.length; i++) {
                const lineClean = lines[i].trim();
                if (!lineClean) continue; 
                const segments = parseCSVLine(lineClean);
                if (segments.length > targetColumnIndex) {
                    const targetCodeValue = segments[targetColumnIndex].replace(/^["']|["']$/g, '').trim();
                    if (targetCodeValue !== "") parsedCodes.push(targetCodeValue);
                }
            }

            if (parsedCodes.length === 0) {
                showToast("No barcode items found in Column F", "error");
            } else {
                let currentVal = toolkitTextarea.value.trim();
                if (currentVal.length > 0) currentVal += "\n";
                toolkitTextarea.value = currentVal + parsedCodes.join("\n") + "\n";
                showToast(`Imported ${parsedCodes.length} barcodes`, "success");
                generateBarcodes();
            }
            if (elements.toolkitExcelInput) elements.toolkitExcelInput.value = "";
        };
        reader.readAsText(file);
    }

    function clearToolkitBox() {
        stopToolkitScanner();
        toolkitTextarea.value = '';
        document.getElementById('toolkitOutput').innerHTML = '';
        scanStatus.innerText = '';
    }

    function generateBarcodes() {
        const input = toolkitTextarea.value;
        const outputDiv = document.getElementById('toolkitOutput');
        outputDiv.innerHTML = '';

        const lines = input.split('\n').map(line => line.trim()).filter(line => line !== '');
        if (lines.length === 0) return;

        const currentThemeColor = '#1C1C1E';

        lines.forEach((code, index) => {
            const container = document.createElement('div');
            container.style.cssText = "background: #fff; padding: 10px; border-radius: 12px; border: 0.5px solid var(--apple-divider); box-shadow: var(--apple-card-shadow); text-align: center; flex: 0 0 auto;";

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.id = 'barcode-render-' + index;
            
            container.appendChild(svg);
            outputDiv.appendChild(container);

            try {
                JsBarcode("#barcode-render-" + index, code, {
                    format: "CODE128",
                    lineColor: currentThemeColor,
                    width: 2,
                    height: 50,
                    displayValue: true,
                    fontSize: 12,
                    margin: 6
                });
            } catch (error) {
                container.innerHTML = `<p style="color:var(--apple-red); font-size:11px; margin:0;">Invalid "${code}"</p>`;
            }
        });
    }

    function scrollToOrders() {
        switchWorkspaceTab('order');
        const container = document.getElementById('targetWorkspaceCard');
        if (container) container.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
</script>
