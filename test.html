<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Little Stars" />
  <title>Little Stars — Muslim Kids Learning</title>
  <style>
    :root {
      --bg-top: #fef9e7;
      --bg-bottom: #e8f8f5;
      --primary: #0e6251;
      --primary-light: #1abc9c;
      --gold: #f39c12;
      --gold-light: #fdebd0;
      --coral: #e74c3c;
      --card-bg: #ffffff;
      --text-dark: #1c2833;
      --shadow: 0 10px 25px rgba(14, 98, 81, 0.14);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "SF Pro Rounded", "Comic Sans MS", "Chalkboard SE", -apple-system, sans-serif;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text-dark);
    }

    /* Subtle Islamic 8-point star watermark pattern */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: 0.045;
      pointer-events: none;
      background-image: radial-gradient(circle at 25px 25px, var(--primary) 3px, transparent 0),
                        radial-gradient(circle at 75px 75px, var(--gold) 3px, transparent 0);
      background-size: 100px 100px;
    }

    .app-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      padding: max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Header Bar */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 68px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 30px;
      box-shadow: 0 5px 0 #094236;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 24px;
      color: var(--primary);
      letter-spacing: 0.3px;
    }

    .brand-text p {
      margin: 2px 0 0;
      font-size: 15px;
      font-weight: 700;
      color: #b9770e;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .star-counter {
      background: var(--gold-light);
      border: 3px solid var(--gold);
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 24px;
      font-weight: 800;
      color: #9c640c;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 rgba(243, 156, 18, 0.3);
    }

    .icon-btn {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      border: none;
      background: #fff;
      color: var(--primary);
      font-size: 28px;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: transform 0.1s ease;
    }

    .icon-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    /* Screens */
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 8px 0;
    }

    .screen.active {
      display: flex;
    }

    /* Home Screen */
    .greeting-banner {
      text-align: center;
      margin-bottom: 24px;
    }

    .greeting-banner .arabic {
      font-size: 34px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .greeting-banner .subtitle {
      font-size: 22px;
      font-weight: 700;
      color: #4d5656;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 380px));
      gap: 28px;
      width: 100%;
      justify-content: center;
    }

    .mode-card {
      background: var(--card-bg);
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      border: 4px solid transparent;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .mode-card:active {
      transform: scale(0.97);
    }

    .mode-card.math {
      border-color: #1abc9c;
    }

    .mode-card.english {
      border-color: #f39c12;
    }

    .mode-emoji {
      width: 110px;
      height: 110px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      font-size: 62px;
    }

    .mode-card.math .mode-emoji {
      background: #e8f8f5;
    }

    .mode-card.english .mode-emoji {
      background: #fef5e7;
    }

    .mode-card h2 {
      margin: 0;
      font-size: 32px;
      color: var(--text-dark);
    }

    .mode-card p {
      margin: 0;
      font-size: 19px;
      color: #566573;
      font-weight: 600;
    }

      background: var(--card-bg);
      width: 100%;
      flex: 1;
      max-height: 540px;
      border-radius: 34px;
